services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignmentos}
      POSTGRES_USER: ${POSTGRES_USER:-assignmentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with a unique POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - assignmentos-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-assignmentos} -d ${POSTGRES_DB:-assignmentos}",
        ]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      AUTH_REQUIRED: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-assignmentos}:${POSTGRES_PASSWORD:?Create .env with a unique POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-assignmentos}
      FRONTEND_ORIGIN: http://localhost:3000
      AI_SERVICE_URL: http://ai-service:8000
      DOCUMENT_SERVICE_URL: http://document-service:8001
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DEV_USER_ID: ${DEV_USER_ID:-00000000-0000-4000-8000-000000000001}
      JWT_SECRET: ${JWT_SECRET:?Create .env with a unique JWT_SECRET}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
      document-service:
        condition: service_started
      ollama:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    ports:
      - "8000:8000"
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.6.8
    volumes:
      - assignmentos-ollama:/root/.ollama
    ports:
      - "11434:11434"

  ollama-model-init:
    image: curlimages/curl:8.12.1
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -fsS http://ollama:11434/api/tags >/dev/null; do
          sleep 2
        done
        curl -fsS http://ollama:11434/api/pull \
          -H 'Content-Type: application/json' \
          -d '{"name":"llama3.2:3b","stream":false}'

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    environment:
      MAX_UPLOAD_BYTES: 20971520
    ports:
      - "8001:8001"
    volumes:
      - assignmentos-documents:/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://backend:4000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    environment:
      NODE_ENV: production
      AUTH_REQUIRED: "true"
      API_INTERNAL_URL: http://backend:4000
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  assignmentos-postgres:
  assignmentos-documents:
  assignmentos-ollama: